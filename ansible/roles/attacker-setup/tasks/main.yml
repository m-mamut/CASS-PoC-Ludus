---
# Role: Attacker Machine (Kali Linux)
# This VM comes pre-installed with pentesting tools
# We'll ensure network connectivity and additional tools

- name: Update package list
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install additional reconnaissance tools
  apt:
    name:
      - nmap
      - nikto
      - sqlmap
      - gobuster
      - directorybuster
      - hydra
      - JohnTheRipper
      - hash-identifier
      - burpsuite
    state: present
  ignore_errors: true

- name: Create lab documentation directory
  ansible.builtin.file:
    path: /root/laboratory
    state: directory
    mode: '0755'

- name: Create lab target information file
  ansible.builtin.copy:
    content: |
      ====================================
      TQ Dev Firm Pentesting Lab
      ====================================
      
      Target Networks:
      - network_0: 10.11.1.0/25 (VLAN 10)
        - dns_server: 10.11.1.50
        - dovecot_0_0: 10.11.1.6
        - admin_0_1: 10.11.1.27
      
      - network_1: 10.11.1.128/25 (VLAN 20)
        - developer_junior_0_1: 10.11.1.136
        - developer_senior_0_1: 10.11.1.137
      
      - network_2: 10.11.2.0/25 (VLAN 30)
        - wordpress_0_0: 10.11.2.6 (exposed via port 8081)
      
      - router_firewall:
        - 10.11.1.3 (network_0)
        - 10.11.1.130 (network_1)
        - 10.11.2.3 (network_2)
        - 192.168.99.100 (internet)
      
      - attacker: 192.168.99.10
      
      Goal: 
      1. Identify vulnerabilities on target web server
      2. Gain initial access via web exploitation
      3. Escalate to root
      4. Harvest credentials/sensitive information
      
      Note: wordpress_0_0 is the initial attack surface (port 8081 exposed)
    dest: /root/laboratory/target_info.txt
    owner: root
    group: root
    mode: '0644'

- name: Configure attack tools directory
  ansible.builtin.file:
    path: /root/tools
    state: directory
    mode: '0755'